<! DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Chat Live</h1>
    <div id="status"><span id="userName"></span> • connesso</div>
  </header>

  <main id="messages"></main>

  <footer>
    <input id="msgInput" type="text" placeholder="Scrivi un messaggio...">
    <button id="sendBtn">Invia</button>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore. js';

    const firebaseConfig = {
      apiKey: "AIzaSyDsehS1NO34Upnzun6kbi1cbeAquf13Rm8",
      authDomain: "chat-demo-mesk.firebaseapp. com",
      projectId: "chat-demo-mesk",
      storageBucket: "chat-demo-mesk.firebasestorage.app",
      messagingSenderId: "1002055151122",
      appId: "1:1002055151122:web:f5d290e279551e30f9f2cb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const myName = urlParams. get('nome');

    if (!myName) {
      alert('Nome mancante!  Torna alla home.');
      window.location.href = 'index.html';
    }

    document.getElementById('userName').textContent = myName;

    const messagesEl = document. getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    function mostraMessaggio(autore, testo, orario) {
      const el = document.createElement('div');
      el.className = 'message';
      
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta. textContent = autore + (orario ? ' • ' + new Date(orario).toLocaleTimeString() : '');
      
      const body = document.createElement('div');
      body.textContent = testo;
      
      el.appendChild(meta);
      el.appendChild(body);
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function inviaMessaggio() {
      const testo = msgInput.value. trim();
      if (!testo) return;
      
      try {
        await addDoc(collection(db, 'messaggi'), {
          autore: myName,
          testo: testo,
          orario: serverTimestamp()
        });
        msgInput.value = '';
      } catch (errore) {
        console.error('Errore invio:', errore);
        alert('Errore invio messaggio: ' + errore.message);
      }
    }

    sendBtn.addEventListener('click', inviaMessaggio);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') inviaMessaggio();
    });

    const q = query(collection(db, 'messaggi'), orderBy('orario', 'asc'));
    onSnapshot(q, (snapshot) => {
      messagesEl.innerHTML = '';
      snapshot.forEach(doc => {
        const dati = doc.data();
        const ts = dati.orario ?  dati.orario.toDate().getTime() : Date.now();
        mostraMessaggio(dati.autore, dati.testo, ts);
      });
    }, (errore) => {
      console. error('Errore Firebase:', errore);
      alert('Errore connessione Firebase: ' + errore.message);
    });
  </script>
</body>
</html>
